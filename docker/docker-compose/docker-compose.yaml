services:
  web-fe:
    build: .
    command: python app.py
    ports:
      - "5050:5000"
  redis:
    image: "redis:7-alpine"
    # No "ports:" here on purpose: web-fe reaches Redis over the internal compose
    # network as "redis:6379". Publishing 6379 would expose an unauthenticated
    # Redis to anyone who can reach this host.
