input {
  beats {
    port => 5044
  }
}

filter {
}

output {
  elasticsearch {
    hosts    => "http://elasticsearch:9200"
    # Joda date format: "dd" = day of month ("DD" would be day of YEAR, e.g. 248).
    index    => "filebeat-test-%{+YYYY.MM.dd}"
    user     => "elastic"
    # Read from the container environment (set in elk/.env). Never hardcode secrets.
    password => "${ELASTIC_PASSWORD}"
  }
}
