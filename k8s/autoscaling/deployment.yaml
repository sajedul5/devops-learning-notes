apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine   # pin versions: ":latest" changes underneath you
        ports:
        - containerPort: 80
        resources:
          # HPA % is measured against the CPU *request*. A small request makes the
          # lab scale visibly; static nginx uses very little CPU per request.
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
