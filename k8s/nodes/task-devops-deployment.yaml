apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      nodeName: minikube-m02  # Ensure the pod runs on this node
      containers:
      - name: nginx
        image: nginx:1.27-alpine   # pin versions: ":latest" changes underneath you
        ports:
        - containerPort: 80
