apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      # Schedule only onto nodes carrying this label (see nodes.md).
      # Works on any cluster, unlike "nodeName", which hardcodes one node's name.
      nodeSelector:
        lab/role: web
      containers:
      - name: nginx
        image: nginx:1.27-alpine   # pin versions: ":latest" changes underneath you
        ports:
        - containerPort: 80
