# pv.yaml
apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    # hostPath = a directory on the node itself. Fine for single-node labs, but
    # never use it in production: data is tied to one node, and hostPath can expose
    # sensitive node files to pods. Use a StorageClass / CSI driver instead.
    path: /mnt/data/statefulset  
