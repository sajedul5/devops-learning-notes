apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-canary
  namespace: app
spec:
  replicas: 1          # 🔥 only 1 pod
  selector:
    matchLabels:
      app: frontend
      version: canary
  template:
    metadata:
      labels:
        app: frontend
        version: canary
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000          # the "node" user in the node:*-alpine image
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false   # app never talks to the K8s API
      containers:
      - name: frontend
        image: sajedul5/devops:frontend-canary
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 3000
        env:
        - name: API_URL
          value: "http://api.app.svc.cluster.local"   # cluster DNS: <service>.<namespace>.svc.cluster.local
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "128Mi"
